<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Link bauen</title>
<style>
body{font:16px system-ui;padding:20px;max-width:520px;margin:0 auto;background:#f4f6fa;color:#111b2b}
h2{margin:0 0 4px}
p{color:#4a5a6e;font-size:13.5px;margin:0 0 14px}
label{display:block;font-size:12.5px;font-weight:700;color:#4a5a6e;margin:12px 0 5px}
input,select{width:100%;padding:11px;margin:0;border:1.5px solid #dde4ec;border-radius:9px;font-size:16px;background:#fff;box-sizing:border-box}
.out{width:100%;height:80px;margin-top:12px;font:12px ui-monospace,monospace;padding:9px;border:1.5px solid #dde4ec;border-radius:9px;box-sizing:border-box}
button{padding:14px;background:#0070ba;color:#fff;border:0;border-radius:9px;font-weight:700;width:100%;font-size:15px;margin-top:14px}
.ok{background:#e6f7ee;color:#0a7a44;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:8px;margin-top:10px;display:none}
</style>
</head>
<body>
<h2>Link erzeugen</h2>
<p>Betrag, Name und Artikel wählen — der Link wird automatisch kopiert.</p>

<label>Betrag (EUR)</label>
<input id="b" value="47.50" inputmode="decimal">

<label>Käufername</label>
<input id="n" value="M. Weber">

<label>Artikel</label>
<select id="a">
<option value="0">Apple AirPods Pro (2. Gen.)</option>
<option value="1">Nintendo Switch Spiel</option>
<option value="2">PS5 Controller</option>
<option value="3">Dyson Staubsauger</option>
<option value="4">Samsung Galaxy Watch</option>
<option value="5">LEGO Technic Set</option>
<option value="6">Sonos Lautsprecher</option>
<option value="7">Fahrradhelm</option>
</select>

<button onclick="mk()">Link bauen &amp; kopieren</button>
<div class="ok" id="ok">Link kopiert</div>

<textarea class="out" id="o" readonly placeholder="Erscheint hier"></textarea>

<script>
const BASE = "https://alwalidalakrami10-ctrl.github.io/zahlung-freigabe/";

function mk(){
  const b = parseFloat(document.getElementById('b').value.replace(',', '.')) || 0;
  const n = document.getElementById('n').value.trim() || "M. Weber";
  const a = document.getElementById('a').value;
  const s = b.toFixed(2) + "|" + n + "|" + a;
  const t = btoa(unescape(encodeURIComponent(s)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const url = BASE + "?v=" + t;
  const o = document.getElementById('o');
  o.value = url;
  o.select();
  navigator.clipboard.writeText(url).catch(()=>document.execCommand('copy'));
  const ok = document.getElementById('ok');
  ok.style.display = 'block';
  setTimeout(()=>ok.style.display='none', 1800);
}
</script>
</body>
</html>
