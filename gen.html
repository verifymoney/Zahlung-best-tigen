<!doctype html><meta charset="utf-8"><title>Link bauen</title>
<style>body{font:16px system-ui;padding:20px;max-width:520px}
input,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ccd;border-radius:8px}
.out{width:100%;height:80px;margin-top:10px;font:12px monospace}
button{padding:12px 20px;background:#0070ba;color:#fff;border:0;border-radius:8px;font-weight:700;width:100%}
</style>
<h2>Link erzeugen</h2>
<label>Betrag</label><input id="b" value="47.50">
<label>Käufername</label><input id="n" value="M. Weber">
<label>Artikel</label>
<select id="a">
<option value="0">AirPods Pro</option><option value="1">Switch Spiel</option>
<option value="2">PS5 Controller</option><option value="3">Dyson</option>
<option value="4">Galaxy Watch</option><option value="5">LEGO Technic</option>
<option value="6">Sonos</option><option value="7">Fahrradhelm</option>
</select>
<button onclick="mk()">Link bauen</button>
<textarea class="out" id="o" readonly></textarea>
<script>
const BASE = "https://DEINNAME.github.io/zahlung-freigabe/";
function mk(){
  const s = document.getElementById('b').value + "|" + document.getElementById('n').value + "|" + document.getElementById('a').value;
  const t = btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  document.getElementById('o').value = BASE + "?v=" + t;
  navigator.clipboard.writeText(document.getElementById('o').value);
}
</script>
