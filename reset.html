<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cache zurücksetzen</title>
<link rel="stylesheet" href="legal.css">
</head>
<body>
<header><b>Pay<i>Pal</i></b><span>Reset</span></header>
<main>
<div class="card">
<h1>Alten Cache entfernen</h1>
<p>Einmalig nötig, damit die neue Version geladen wird.</p>
<ul id="log" style="font-size:13px;color:#0a7a44;padding-left:18px"></ul>
<p class="back"><a href="index.html">Weiter zur Seite</a></p>
</div>
</main>
<script>
(async () => {
  const log = document.getElementById('log');
  const add = t => { const li = document.createElement('li'); li.textContent = t; log.appendChild(li); };
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r => r.unregister()));
    add(regs.length + ' Service Worker abgemeldet');
  } catch (e) { add('SW-Abmeldung fehlgeschlagen'); }
  try {
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
    add(keys.length + ' Caches gelöscht');
  } catch (e) { add('Cache-Löschung fehlgeschlagen'); }
  add('Fertig');
  setTimeout(() => location.replace('./index.html?r=' + Date.now()), 1500);
})();
</script>
</body>
</html>
